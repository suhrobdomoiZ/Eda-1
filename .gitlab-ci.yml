stages:
  - test
  - build

variables:
  GO_VERSION: "1.26.1"
  REGISTRY: $CI_REGISTRY_IMAGE

# Test Stage

test:
  stage: test
  image: golang:${GO_VERSION}
  before_script:
    - go mod download
  script:
    # Запуск тестов с coverage для всех сервисов
    - go test -v -race -coverprofile=coverage_auth.out ./services/auth/...
    - go test -v -race -coverprofile=coverage_customer.out ./services/customer/...
    - go test -v -race -coverprofile=coverage_courier.out ./services/courier/...
    - go test -v -race -coverprofile=coverage_restaurant.out ./services/restaurant/...
    
    # Проверка покрытия >= 30% для каждого сервиса
    - |
      check_coverage() {
        SERVICE=$1
        FILE=$2
        COVERAGE=$(go tool cover -func=$FILE | grep total | awk '{print $3}' | sed 's/%//')
        if [ -z "$COVERAGE" ]; then
          echo "$SERVICE: no coverage data"
          exit 1
        fi
        if awk "BEGIN {exit !($COVERAGE < 30)}"; then
          echo "$SERVICE: coverage $COVERAGE% < 30%"
          exit 1
        fi
        echo "$SERVICE: coverage $COVERAGE% >= 30%"
      }
    
    - check_coverage "auth" "coverage_auth.out"
    - check_coverage "customer" "coverage_customer.out"
    - check_coverage "courier" "coverage_courier.out"
    - check_coverage "restaurant" "coverage_restaurant.out"
    
    
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage_*.out
      - coverage.out
    expire_in: 1 week

# Build Stage

.build_template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "services/${SERVICE}/Dockerfile" \
        --destination "$REGISTRY/${SERVICE}:${CI_COMMIT_SHORT_SHA}" \
        --destination "$REGISTRY/${SERVICE}:latest" \
        --cache=true \
        --cache-ttl=24h
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  needs:
    - test

build:auth:
  extends: .build_template
  variables:
    SERVICE: auth

build:api_gateway:
  extends: .build_template
  variables:
    SERVICE: api_gateway

build:customer:
  extends: .build_template
  variables:
    SERVICE: customer

build:restaurant:
  extends: .build_template
  variables:
    SERVICE: restaurant

build:courier:
  extends: .build_template
  variables:
    SERVICE: courier
